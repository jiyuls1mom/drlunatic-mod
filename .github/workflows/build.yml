      - name: Read monster data from the HamSandwich source
        run: |
          git clone --depth 1 https://github.com/SpaceManiac/HamSandwich.git hs
          python3 tools/parse_monsters.py hs/source/supreme tools/monsters_src.json
          rm -rf hs
      - name: Download Dr. Lunatic Supreme (free on itch.io) and convert its sprites
        run: |
          URL=$(curl -sf -X POST -d '' https://hamumu.itch.io/dr-lunatic-supreme-with-cheese/file/700882 | jq -r .url)
          curl -sfL -o supreme8_install.exe "$URL"
          7z x -y -osup supreme8_install.exe > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install pillow
          python3 tools/build_assets.py "$(dirname $(find sup -iname gamepal.bmp | head -1))" src/main/resources
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
          validate-wrappers: false
      - name: Build the mod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: drlunatic-supreme-mod
          path: build/libs/drlunatic-supreme-1.3.0.jar
      - name: Publish the jar as a download (the Releases page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/drlunatic-supreme-*.jar | grep -v sources | head -1)
          cp "$JAR" drlunatic-supreme.jar
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest "$JAR" drlunatic-supreme.jar --repo "$GITHUB_REPOSITORY" --title "Dr. Lunatic mod $(basename "$JAR" .jar)" --notes "Built automatically. Put the jar in .minecraft/mods together with Fabric API (Minecraft 1.21.1)."
